{% extends 'base.html' %}

{% block title %}Page Not Found - GovScheme NLP{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card gov-card p-5 my-5 mx-auto" style="max-width: 500px;">
        <h1 class="display-1 fw-bold text-primary mb-0">404</h1>
        <h4 class="fw-bold text-dark mb-3">{{ message or 'Page Not Found' }}</h4>
        <p class="text-muted mb-4">The page or scheme resource you are looking for does not exist.</p>
        <div>
            <a href="{{ url_for('index') }}" class="btn btn-primary fw-semibold px-4">Return to Home</a>
        </div>
    </div>
</div>
{% endblock %}
